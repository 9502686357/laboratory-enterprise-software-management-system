<!DOCTYPE html>
<html lang="en">

<head>

    <meta name="viewport"

    <title>Laboratory Enterprise Management</title>

    <link rel="stylesheet"
          href="style.css">
</head>

<body>

<script src="app.js"></script>

</html>
