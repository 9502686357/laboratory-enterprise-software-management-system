name: Laboratory Software CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:

  instrument-service:

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: instrument-service

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build and test Instrument Service
        run: mvn clean verify


  experiment-service:

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: experiment-service

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build and test Experiment Service
        run: mvn clean verify
